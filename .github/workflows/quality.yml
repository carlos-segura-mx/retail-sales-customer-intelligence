name: CASE-03 public QA
on:
  push:
    branches: [main]
  pull_request:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Validate precomputed results
        run: python validate_release.py
      - name: Run analytical and editorial tests
        run: python -m pytest -q tests
      - name: Compile dashboard
        run: python -m py_compile app.py
      - name: Smoke-test both languages
        run: python tests/smoke_app.py
